services:
  - type: web
    name: transcend-infinity-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: JWT_ISSUER
        value: transcend-infinity-api
      - key: JWT_AUDIENCE
        value: transcend-infinity-web
      - key: CORS_ORIGINS
        value: https://transcend-infinity.pages.dev,https://transcendinfinity.com.br
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://api.transcendinfinity.com.br/api/v1/auth/google/callback
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: BACKEND_URL
        value: https://api.transcendinfinity.com.br
      - key: ADMIN_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@transcend-infinity.games
      - key: FRONTEND_URL
        value: https://transcend-infinity.pages.dev
